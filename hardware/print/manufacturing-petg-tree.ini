# Koala tree-support variant: load AFTER the shared printer profile, single part per job
# (the Flathub PrusaSlicer 2.9.6 that has organic supports crashes on --merge; the Debian
# 2.5.0 has no organic style). Owner's choice for the v2 thigh and shank, 2026-09-19.
perimeters = 4
fill_density = 30%
layer_height = 0.2
support_material = 1
support_material_style = organic
support_material_buildplate_only = 1
support_material_threshold = 45
support_material_contact_distance = 0.25
support_material_interface_layers = 3
brim_width = 4

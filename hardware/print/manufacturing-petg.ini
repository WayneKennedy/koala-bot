# Koala-specific geometry review settings; load AFTER the shared printer profile.
# These slices establish a plausible print approach, not a successful print.
perimeters = 4
fill_density = 30%
layer_height = 0.2
support_material = 1
support_material_style = snug
# House rule (3d-printing decisions.md): support grows from the bed only, never off the part,
# so horizontal screw holes stay open. Plate 1 (2026-09-19) was sliced without this and its
# four M2 ear holes came out blocked.
support_material_buildplate_only = 1
support_material_threshold = 45
support_material_contact_distance = 0.25
support_material_interface_layers = 3
brim_width = 4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koala Lower Body</title>
<style>
/* Single dark instrument palette - this is a shop-floor CAD check, not a
   document, so it commits to one look and paints every colour explicitly. */
:root {
  --ground: #14171b;
  --panel: #1b1f25;
  --panel-2: #22272e;
  --line: #2e343c;
  --ink: #dfe4ea;
  --ink-dim: #8d97a3;
  --ink-faint: #5e6874;
  --accent: #55b3a4;
  --warn: #d8b24a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Inter var", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 13px/1.5 var(--sans); overflow: hidden;
}
#app { display: grid; grid-template-columns: 272px 1fr; height: 100vh; }

/* ---- sidebar ---- */
aside {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
header p {
  margin: 3px 0 0; font-size: 11px; color: var(--ink-faint);
  font-family: var(--mono);
}
.tabs { display: flex; gap: 4px; padding: 10px 12px; }
.tabs button {
  flex: 1; padding: 6px 8px; font: 600 11px/1 var(--sans);
  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  color: var(--ink-dim); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 5px;
}
.tabs button[aria-selected="true"] {
  color: var(--ground); background: var(--accent); border-color: var(--accent);
}
.tabs button:focus-visible, .opt:focus-visible, .row:focus-visible,
.view button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#list { flex: 1; overflow-y: auto; padding: 0 6px 12px; min-height: 0; }
.group {
  padding: 12px 10px 5px; font: 600 10px/1 var(--sans);
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-faint);
  display: flex; justify-content: space-between; align-items: baseline;
}
.group span { font-family: var(--mono); letter-spacing: 0; }
.row {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 9px;
  align-items: center; width: 100%; padding: 5px 10px; border: 0;
  border-radius: 5px; background: none; color: var(--ink);
  font: 12px/1.35 var(--mono); cursor: pointer; text-align: left;
}
.row:hover { background: var(--panel-2); }
.row[aria-pressed="false"] { color: var(--ink-faint); }
.row[aria-pressed="false"] .dot { opacity: 0.22; }
.row.solo { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 2px; }
.qty { font-size: 11px; color: var(--ink-faint); }

footer { border-top: 1px solid var(--line); padding: 10px 12px; }
.opt {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 4px;
  border: 0; background: none; color: var(--ink-dim);
  font: 11px/1 var(--sans); cursor: pointer; border-radius: 4px;
}
.opt:hover { color: var(--ink); }
.box {
  width: 13px; height: 13px; border: 1px solid var(--line);
  border-radius: 3px; background: var(--panel-2); flex: none;
}
.opt[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }

/* ---- stage ---- */
main { position: relative; min-width: 0; }
canvas { display: block; }
.view {
  position: absolute; top: 14px; right: 14px; display: flex; gap: 4px;
  background: rgba(27, 31, 37, 0.88); padding: 4px; border-radius: 6px;
  border: 1px solid var(--line); backdrop-filter: blur(6px);
}
.view button {
  padding: 5px 9px; border: 0; border-radius: 4px; cursor: pointer;
  background: none; color: var(--ink-dim);
  font: 600 10px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase;
}
.view button:hover { color: var(--ink); background: var(--panel-2); }

#hud {
  position: absolute; left: 14px; bottom: 14px; display: flex; gap: 18px;
  background: rgba(27, 31, 37, 0.88); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 14px; backdrop-filter: blur(6px);
  font-family: var(--mono); font-size: 11px;
}
#hud div { display: flex; flex-direction: column; gap: 2px; }
#hud b { font: 600 9px/1 var(--sans); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-faint); }
#hud span { font-variant-numeric: tabular-nums; }
#sel { color: var(--accent); }
#loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--ink-faint); font-family: var(--mono); font-size: 12px;
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Koala lower body</h1>
      <p id="stamp">loading…</p>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-assembly" aria-selected="true">Assembly</button>
      <button role="tab" id="tab-parts" aria-selected="false">Parts</button>
    </div>
    <div id="list"></div>
    <footer>
      <button class="opt" id="opt-ghost" aria-pressed="true"><i class="box"></i>Servo keep-outs</button>
      <button class="opt" id="opt-wire" aria-pressed="false"><i class="box"></i>Wireframe</button>
      <button class="opt" id="opt-grid" aria-pressed="true"><i class="box"></i>Ground grid</button>
    </footer>
  </aside>
  <main>
    <div class="view">
      <button data-view="iso">Iso</button>
      <button data-view="front">Front</button>
      <button data-view="side">Side</button>
      <button data-view="top">Top</button>
    </div>
    <div id="hud"></div>
    <div id="loading">loading geometry…</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const GRID_COL = 0x2a3038, AXIS_COL = 0x3d4650;

function decode(s, Type) {
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Type(u8.buffer);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$("main").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14171b);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 8000);
camera.up.set(0, 0, 1);                       // build123d is Z-up

scene.add(new THREE.HemisphereLight(0xbcd0e0, 0x20242a, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.75);
const fill = new THREE.DirectionalLight(0xa8c0d8, 0.35);
scene.add(key, fill);

const root = new THREE.Group();
const helpers = new THREE.Group();
scene.add(root, helpers);

/* ---- orbit: azimuth/elevation about the Z axis ---- */
const cam = { az: -0.95, el: 0.32, r: 600, t: new THREE.Vector3() };
function place() {
  const ce = Math.cos(cam.el);
  camera.position.set(
    cam.t.x + cam.r * ce * Math.cos(cam.az),
    cam.t.y + cam.r * ce * Math.sin(cam.az),
    cam.t.z + cam.r * Math.sin(cam.el));
  camera.lookAt(cam.t);
  key.position.copy(camera.position).add(new THREE.Vector3(60, 40, 220));
  fill.position.copy(camera.position).multiplyScalar(-1);
}
const el = renderer.domElement;
let drag = null;
el.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey };
  el.setPointerCapture(e.pointerId);
});
el.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const k = cam.r * 0.0016;
    const right = new THREE.Vector3(-Math.sin(cam.az), Math.cos(cam.az), 0);
    const up = new THREE.Vector3().crossVectors(
      camera.position.clone().sub(cam.t).normalize(), right).normalize();
    cam.t.addScaledVector(right, -dx * k).addScaledVector(up, -dy * k);
  } else {
    cam.az -= dx * 0.008;
    cam.el = Math.max(-1.5, Math.min(1.5, cam.el + dy * 0.008));
  }
  place();
});
addEventListener("pointerup", () => { drag = null; });
el.addEventListener("contextmenu", (e) => e.preventDefault());
el.addEventListener("wheel", (e) => {
  e.preventDefault();
  cam.r = Math.max(40, Math.min(4000, cam.r * (1 + Math.sign(e.deltaY) * 0.12)));
  place();
}, { passive: false });

function resize() {
  const w = $("main").clientWidth, h = $("main").clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

/* ---- scene assembly ---- */
let DATA = null, mode = "assembly", meshes = [], solo = null;
const opts = { ghost: true, wire: false, grid: true };

function gridLines(x0, x1, y0, y1, step, z) {
  const pts = [];
  for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step)
    pts.push(x, y0, z, x, y1, z);
  for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step)
    pts.push(x0, y, z, x1, y, z);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: GRID_COL }));
}

function load(which) {
  mode = which;
  for (const m of meshes) { m.geometry.dispose(); m.material.dispose(); }
  root.clear(); helpers.clear(); meshes = []; solo = null;
  const box = new THREE.Box3();

  for (const item of DATA[which]) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position",
      new THREE.BufferAttribute(decode(item.pos, Float32Array), 3));
    g.setIndex(new THREE.BufferAttribute(decode(item.idx, Uint32Array), 1));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      color: new THREE.Color(item.colour),
      metalness: 0.05, roughness: 0.72, flatShading: true,
      transparent: item.ghost, opacity: item.ghost ? 0.24 : 1,
      depthWrite: !item.ghost, side: THREE.DoubleSide,
    }));
    m.userData = item;
    root.add(m); meshes.push(m);
    box.expandByObject(m);
  }

  const meta = DATA.meta;
  if (which === "assembly") {
    helpers.add(gridLines(-260, 260, -260, 260, meta.grid, meta.ground_z));
  } else {
    helpers.add(gridLines(0, meta.bed[0], 0, meta.bed[1], meta.grid, 0));
    const b = new THREE.BufferGeometry();
    const [bx, by] = meta.bed;
    b.setAttribute("position", new THREE.BufferAttribute(new Float32Array([
      0, 0, 0, bx, 0, 0, bx, 0, 0, bx, by, 0,
      bx, by, 0, 0, by, 0, 0, by, 0, 0, 0, 0]), 3));
    helpers.add(new THREE.LineSegments(
      b, new THREE.LineBasicMaterial({ color: AXIS_COL })));
  }

  box.getCenter(cam.t);
  cam.r = box.getBoundingSphere(new THREE.Sphere()).radius * 2.6;
  place(); applyVisibility(); buildList(); setHud(null);
}

function applyVisibility() {
  for (const m of meshes) {
    const it = m.userData;
    const off = (it.ghost && !opts.ghost) || (solo && solo !== it.name);
    m.visible = !off;
    m.material.wireframe = opts.wire;
    if (it.hidden) m.visible = false;
  }
  helpers.visible = opts.grid;
}

const KINDS = [["printed", "Printed"], ["bought", "Bought"],
               ["keep-out", "Keep-out"], ["coupon", "Test coupons"]];

function buildList() {
  const list = $("#list"); list.innerHTML = "";
  for (const [kind, label] of KINDS) {
    const items = DATA[mode].filter((i) => (i.kind || "printed") === kind);
    if (!items.length) continue;
    const h = document.createElement("div");
    h.className = "group";
    h.innerHTML = `${label}<span>${items.length}</span>`;
    list.appendChild(h);
    for (const it of items) {
      const b = document.createElement("button");
      b.className = "row";
      b.setAttribute("aria-pressed", it.hidden ? "false" : "true");
      b.innerHTML = `<i class="dot" style="background:${it.colour}"></i>` +
        `<span>${it.name}</span>` +
        `<span class="qty">${it.qty ? "×" + it.qty : it.size.join("×")}</span>`;
      b.onclick = (e) => {
        if (e.shiftKey) { it.hidden = !it.hidden; }
        else { solo = solo === it.name ? null : it.name; }
        applyVisibility(); buildList(); setHud(it);
      };
      b.onmouseenter = () => setHud(it);
      if (solo === it.name) b.classList.add("solo");
      list.appendChild(b);
    }
  }
}

function setHud(it) {
  const m = DATA.meta;
  const stats = mode === "assembly"
    ? [["Stance", `${m.stance.toFixed(0)} mm`],
       ["Track", `${m.track.toFixed(0)} mm`],
       ["Hip axes", `${m.hip_axes.toFixed(0)} mm`]]
    : [["Bed ref", `${m.bed[0]}×${m.bed[1]} mm`],
       ["Parts", String(DATA.parts.length)]];
  const sel = it
    ? `<div><b>${it.name}</b><span id="sel">${it.size.join(" × ")} mm</span></div>`
    : `<div><b>Selection</b><span id="sel">click to solo · shift-click to hide</span></div>`;
  $("#hud").innerHTML = sel + stats.map(
    ([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("");
}

/* ---- controls ---- */
const VIEWS = { iso: [-0.95, 0.32], front: [0, 0], side: [Math.PI / 2, 0],
                top: [-Math.PI / 2, 1.5] };
for (const b of document.querySelectorAll(".view button"))
  b.onclick = () => { [cam.az, cam.el] = VIEWS[b.dataset.view]; place(); };

for (const [id, k] of [["#opt-ghost", "ghost"], ["#opt-wire", "wire"],
                       ["#opt-grid", "grid"]]) {
  $(id).onclick = () => {
    opts[k] = !opts[k];
    $(id).setAttribute("aria-pressed", String(opts[k]));
    applyVisibility();
  };
}
$("#tab-assembly").onclick = () => switchTab("assembly");
$("#tab-parts").onclick = () => switchTab("parts");
function switchTab(which) {
  $("#tab-assembly").setAttribute("aria-selected", String(which === "assembly"));
  $("#tab-parts").setAttribute("aria-selected", String(which === "parts"));
  for (const it of DATA[which]) it.hidden = false;
  load(which);
}

(function tick() { requestAnimationFrame(tick); renderer.render(scene, camera); })();

fetch("scene.json?" + Date.now()).then((r) => r.json()).then((d) => {
  DATA = d;
  const tris = d.assembly.concat(d.parts).reduce((a, i) => a + i.tris, 0);
  $("#stamp").textContent =
    `${d.parts.length} printed parts · ${tris.toLocaleString()} tris`;
  $("#loading").remove();
  resize(); load("assembly");
}).catch((e) => {
  $("#loading").textContent =
    "scene.json did not load (" + e.message + "). Serve this page with " +
    "`uv run python -m koala_hardware.viewer`; opening the file directly " +
    "will not work.";
});
</script>
</body>
</html>

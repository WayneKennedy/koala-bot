document.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.mode));
renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};
renderer.domElement.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.007;el=Math.max(-1.4,Math.min(1.4,el+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];place()};
renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onpointercancel=()=>drag=null;
renderer.domElement.onwheel=e=>{e.preventDefault();radius=Math.max(45,Math.min(700,radius*Math.exp(e.deltaY*.001)));place()};
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);place()};choose('assembly');
</script></html>
